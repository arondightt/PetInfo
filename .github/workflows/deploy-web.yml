name: 🌐 Deploy Web (Vercel)

# Dispara SOMENTE quando arquivos em src/web/ mudarem
on:
  push:
    branches:
      - main
    paths:
      - 'src/web/**'

jobs:
  deploy:
    name: ▲ Deploy na Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Deploy na Vercel (Produção)
        working-directory: src/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --token=$VERCEL_TOKEN --yes

      - name: ✅ Deploy concluído
        run: echo "Front-end deployado com sucesso na Vercel!"
